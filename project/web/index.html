<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Newsreader%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div class="relative flex size-full min-h-screen flex-col bg-slate-50 group/design-root overflow-x-hidden" style='font-family: Newsreader, "Noto Sans", sans-serif;'>
      <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#e7edf3] px-10 py-3">
          <div class="flex items-center gap-8">
            <div class="flex items-center gap-4 text-[#0e141b]">
              <div class="size-4">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor"></path></svg>
              </div>
              <h2 class="text-[#0e141b] text-lg font-bold leading-tight tracking-[-0.015em]">NewsToday</h2>
            </div>
            <div class="flex items-center gap-9">
              <a class="text-[#0e141b] text-sm font-medium leading-normal" href="#">Top Stories</a>
              <a class="text-[#0e141b] text-sm font-medium leading-normal" href="#">Politics</a>
              <a class="text-[#0e141b] text-sm font-medium leading-normal" href="#">Sports</a>
              <a class="text-[#0e141b] text-sm font-medium leading-normal" href="#">Entertainment</a>
              <a class="text-[#0e141b] text-sm font-medium leading-normal" href="#">Business</a>
              <a class="text-[#0e141b] text-sm font-medium leading-normal" href="#">Technology</a>
            </div>
          </div>
          <div class="flex flex-1 justify-end gap-8">
            <label class="flex flex-col min-w-40 !h-10 max-w-64">
              <div class="flex w-full flex-1 items-stretch rounded-lg h-full">
                <div
                  class="text-[#4e7097] flex border-none bg-[#e7edf3] items-center justify-center pl-4 rounded-l-lg border-r-0"
                  data-icon="MagnifyingGlass"
                  data-size="24px"
                  data-weight="regular"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                    <path
                      d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"
                    ></path>
                  </svg>
                </div>
                <input
                  placeholder="Search"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0e141b] focus:outline-0 focus:ring-0 border-none bg-[#e7edf3] focus:border-none h-full placeholder:text-[#4e7097] px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal"
                  value=""
                />
              </div>
            </label>
            <button
              class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#e7edf3] text-[#0e141b] gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5"
            >
              <div class="text-[#0e141b]" data-icon="Bell" data-size="20px" data-weight="regular">
                <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                  <path
                    d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"
                  ></path>
                </svg>
              </div>
            </button>
            <div
              class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
              style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCs5ExBZ_I1zknn1wxx0km41HH6XnpZRHXwnsmUHNxzabPJ0PtaQECOxcs9mpYOnMtilRinlKXRjmCaxGRXLYw3IU1tPLBr13e9V3fU0pJ521JzCp451wlUGQ5X-aiIYSzGf55Zx6V-VAi4ECEmfofEnj2dOyaI8hPMBX2FiWMB0Gbj4Vp5ORHCGMAxbPBO-L3j3zG9FxmbeAfgKB7zeZTmOOMu6yfso-PMrZln3DEAmjtLYn0LeN6KUsxtW2HkoL9SSJQGL-3S6Q");'
            ></div>
          </div>
        </header>
        <div class="px-40 flex flex-1 justify-center py-5">
          <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
            <h2 class="text-[#0e141b] tracking-light text-[28px] font-bold leading-tight px-4 text-left pb-3 pt-5">Top Stories</h2>
            <!-- News articles will be injected here by JavaScript -->
          </div>
        </div>
      </div>
    </div>
    <script>
      function createArticleHtml(article) {
          // article.urlToImage is not in our current news_articles.json, use a placeholder
          const imageUrl = article.urlToImage || 'https://via.placeholder.com/640x360.png?text=News';
          // article.source.name or a category is not in our current news_articles.json, use a default
          const category = article.sourceName || 'General News';

          return `
          <div class="p-4 @container">
            <div class="flex flex-col items-stretch justify-start rounded-lg @xl:flex-row @xl:items-start">
              <div
                class="w-full bg-center bg-no-repeat aspect-video bg-cover rounded-lg @xl:w-1/3 @xl:aspect-square"
                style='background-image: url("${imageUrl}");'
              ></div>
              <div class="flex w-full min-w-72 grow flex-col items-stretch justify-center gap-1 py-4 @xl:py-0 @xl:px-4 @xl:w-2/3">
                <p class="text-[#4e7097] text-sm font-normal leading-normal">${category}</p>
                <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="text-[#0e141b] text-lg font-bold leading-tight tracking-[-0.015em] hover:underline">${article.title}</a>
                <div class="flex items-end gap-3 justify-between">
                  <p class="text-[#4e7097] text-base font-normal leading-normal">
                    ${article.summary || 'No summary available.'}
                  </p>
                </div>
              </div>
            </div>
          </div>
          `;
      }

      document.addEventListener('DOMContentLoaded', () => {
          const newsContainer = document.querySelector('.layout-content-container');

          fetch('../data/news_articles.json')
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`HTTP error! status: ${response.status}`);
                  }
                  return response.json();
              })
              .then(data => {
                  // Assuming data is an array of articles. The fetch_news.py saves a list.
                  const articlesToDisplay = data.slice(0, 10);

                  articlesToDisplay.forEach(article => {
                      const articleHtml = createArticleHtml(article);
                      newsContainer.insertAdjacentHTML('beforeend', articleHtml);
                  });
              })
              .catch(error => {
                  console.error('Error fetching or displaying news:', error);
                  newsContainer.insertAdjacentHTML('beforeend', '<p class="text-red-500 text-center">Could not load news articles.</p>');
              });
      });
    </script>
  </body>
</html>
